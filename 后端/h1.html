<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>勇者闯关：秘境征程</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #4fc3f7, #ffcc80);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-shadow: 2px 2px 4px #333;
        }

        .logo {
            font-size: 42px;
            font-weight: bold;
            color: #ffeb3b;
            margin-bottom: 40px;
            text-align: center;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 320px;
        }

        .btn {
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background: #2196f3;
            color: white;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .btn:hover {
            background: #1976d2;
            transform: scale(1.05);
        }

        .footer {
            margin-top: 50px;
            font-size: 14px;
            opacity: 0.8;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="logo">勇者闯关：秘境征程</div>

    <div class="menu">
        <button class="btn">开始游戏</button>
        <button class="btn">注册账号</button>
        <button class="btn">关卡选择</button>
        <button class="btn">角色养成</button>
        <button class="btn">商店</button>
        <button class="btn">设置</button>
    </div>

    <div class="footer">
        2D横版冒险闯关小游戏<br>
        开发成员：葛孝语 张逸
    </div>

</body>
</html>
